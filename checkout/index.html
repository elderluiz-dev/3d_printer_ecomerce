<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="app-header">
        
        <a href="home/index.html" class="app-header__icon-btn" aria-label="Início">
            <img src="assets/home.png" alt="" width="38" height="38">
        </a>
        
        <form class="app-header__search" action="/buscar" method="get">
            <input
                type="text"
                name="q"
                class="app-header__search-input"
                placeholder="PESQUISAR"
                aria-label="Pesquisar"
            />

            <button type="submit" class="app-header__search-btn" aria-label="Buscar">
                <img src="assets/search.png" alt="" width="24" height="24">
            </button>
        </form>
        
        <div class="app-header__actions">

            <a href="/carrinho" class="app-header__icon-btn" aria-label="Carrinho">
                <img src="assets/cart.png" alt="" width="34" height="34">
            </a>

            <a href="/perfil" class="app-header__avatar" aria-label="Perfil do usuário">
                <img src="assets/user.png" alt="" width="48" height="48">
            </a>

        </div>
    </header>
    

    <main class="checkout-container">

        <section class="checkout-products">

            <div class="address-card">

                <div class="address-title">
                    <h3>ENDEREÇO: Cidade Nova, Rua Formosa - 123</h3>
                    <p>Receba 10% de cashback em caso de atraso</p>
                </div>

                <div class="product">

                    <img src="assets/produto1.png" alt="Decoração para quarto minimalista">

                    <div class="product-info">
                        <h4>Decoração para quarto minimalista</h4>
                        <p>Quantidade: 1</p>
                        <span>R$ 65,00</span>
                    </div>

                </div>

                <div class="product">

                    <img src="assets/produto2.png" alt="Peça industrial para ligas hidráulicas">

                    <div class="product-info">
                        <h4>Peça industrial para ligas hidráulicas</h4>
                        <p>Quantidade: 3</p>
                        <span>R$ 255,00</span>
                    </div>

                </div>

            </div>

            <div class="coupon">

                <input
                    type="text"
                    placeholder="ADICIONAR CUPOM DE DESCONTO"
                    aria-label="Cupom de desconto"
                >

                <button type="button">APLICAR</button>

            </div>

        </section>

        <section class="checkout-payment">

            <h3>Método de pagamento</h3>

            <div class="payment-options">

                <label class="payment-option selected">
                    <input type="radio" name="payment" value="pix" checked>
                    PIX
                </label>

                <label class="payment-option">
                    <input type="radio" name="payment" value="credito">
                    Cartão de crédito
                </label>

                <label class="payment-option">
                    <input type="radio" name="payment" value="debito">
                    Cartão de débito
                </label>

                <label class="payment-option">
                    <input type="radio" name="payment" value="boleto">
                    Boleto
                </label>

            </div>

            <button type="button" class="generate-qr">
                GERAR QR CODE
            </button>

            <div class="qr-container">
                <img src="assets/qr-code.png" alt="QR Code para pagamento via PIX">
            </div>

        </section>

    </main>




</body>
</html>
